services:
  db:
    image: postgres:16-alpine
    container_name: beep-the-clip-db
    environment:
      POSTGRES_USER: beep
      POSTGRES_PASSWORD: beep
      POSTGRES_DB: beeptheclip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beep -d beeptheclip"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: beep-the-clip-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
